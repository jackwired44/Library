<!doctype html>
<title>Wired CIO Playbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f6;
    --surface: #ffffff;
    --surface-sunken: #e4e9f1;
    --ink: #161b24;
    --muted: #57687a;
    --border: #d7dee8;
    --accent: #0a66c2;
    --accent-ink: #ffffff;
    --accent-soft: #e6f0fb;
    --good: #1e7b4d;
    --good-soft: #e6f4ec;
    --bad: #b5443b;
    --bad-soft: #fbeae8;
    --shadow: 0 1px 2px rgba(22, 27, 36, 0.05), 0 14px 30px -16px rgba(22, 27, 36, 0.22);

    --track-foundations: #0a66c2;
    --track-dynamics: #5b4fe0;
    --track-managedit: #0e8f76;
    --track-customdev: #b5650a;
    --track-azure: #0e7c9c;
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f131a;
      --surface: #171d27;
      --surface-sunken: #1e2531;
      --ink: #e7ecf3;
      --muted: #93a2b4;
      --border: #2a3342;
      --accent: #5aa4ec;
      --accent-ink: #0b1622;
      --accent-soft: #1a2a3c;
      --good: #45b083;
      --good-soft: #163526;
      --bad: #e2766a;
      --bad-soft: #3a1f1d;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 16px 32px -16px rgba(0, 0, 0, 0.6);
      --track-foundations: #5aa4ec;
      --track-dynamics: #a49af0;
      --track-managedit: #3fc39f;
      --track-customdev: #e0964a;
      --track-azure: #52bcd9;
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --bg: #0f131a;
    --surface: #171d27;
    --surface-sunken: #1e2531;
    --ink: #e7ecf3;
    --muted: #93a2b4;
    --border: #2a3342;
    --accent: #5aa4ec;
    --accent-ink: #0b1622;
    --accent-soft: #1a2a3c;
    --good: #45b083;
    --good-soft: #163526;
    --bad: #e2766a;
    --bad-soft: #3a1f1d;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 16px 32px -16px rgba(0, 0, 0, 0.6);
    --track-foundations: #5aa4ec;
    --track-dynamics: #a49af0;
    --track-managedit: #3fc39f;
    --track-customdev: #e0964a;
    --track-azure: #52bcd9;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  ::selection { background: var(--accent-soft); color: var(--ink); }
  a { color: inherit; }
  h1, h2, h3 { text-wrap: balance; margin: 0; }
  [hidden] { display: none !important; }

  .mono { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", monospace; }

  .eyebrow {
    font-family: "IBM Plex Mono", monospace;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
  }

  /* ---------------- topbar ---------------- */

  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 13px clamp(18px, 4vw, 44px);
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }

  .brand { display: flex; align-items: center; gap: 9px; flex-shrink: 0; cursor: pointer; background: none; border: none; padding: 0; }
  .brand-mark {
    width: 26px; height: 26px; border-radius: 6px;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center;
    font-family: "IBM Plex Mono", monospace; font-weight: 700; font-size: 11px;
  }
  .brand-text { display: flex; flex-direction: column; line-height: 1.1; text-align: left; }
  .brand-name { font-family: "Archivo", sans-serif; font-weight: 700; font-size: 14px; color: var(--ink); }
  .brand-sub { font-size: 10px; color: var(--muted); font-family: "IBM Plex Mono", monospace; letter-spacing: 0.04em; }

  .topbar-spacer { flex: 1; }

  .search-wrap { position: relative; width: 100%; max-width: 260px; }
  .search-input {
    width: 100%; font: inherit; font-size: 13px;
    padding: 8px 12px 8px 30px;
    border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-sunken); color: var(--ink);
  }
  .search-input::placeholder { color: var(--muted); }
  .search-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 13px; height: 13px; color: var(--muted); pointer-events: none; }

  .btn {
    font: inherit; font-size: 12.5px; font-weight: 600;
    border-radius: 8px; padding: 8px 13px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--ink); cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---------------- index view ---------------- */

  .index-hero {
    padding: 40px clamp(18px, 4vw, 44px) 22px;
    border-bottom: 1px solid var(--border);
  }
  .index-hero h1 {
    font-family: "Archivo", sans-serif;
    font-size: clamp(26px, 3.2vw, 36px);
    font-weight: 800;
    letter-spacing: -0.015em;
    margin: 10px 0 8px;
  }
  .index-hero .tagline { margin: 0; color: var(--muted); font-size: 15px; max-width: 62ch; line-height: 1.5; }

  .track-filters {
    display: flex; flex-wrap: wrap; gap: 8px;
    padding: 18px clamp(18px, 4vw, 44px) 0;
  }
  .chip {
    font: inherit; font-family: "IBM Plex Mono", monospace;
    font-size: 11px; font-weight: 600; letter-spacing: 0.02em;
    padding: 7px 12px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--muted); cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .chip .swatch { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .chip.active { border-color: var(--chip-color, var(--accent)); color: var(--chip-color, var(--accent)); background: color-mix(in srgb, var(--chip-color, var(--accent)) 12%, var(--surface)); }
  .chip.active .swatch { background: var(--chip-color, var(--accent)); }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(258px, 1fr));
    gap: 14px;
    padding: 20px clamp(18px, 4vw, 44px) 70px;
  }

  .card {
    text-align: left;
    display: flex; flex-direction: column; gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--track-color, var(--accent));
    border-radius: 11px;
    padding: 16px 17px;
    cursor: pointer;
    font: inherit; color: var(--ink);
    box-shadow: var(--shadow);
    transition: transform 0.12s ease, border-color 0.12s ease;
  }
  .card:hover { transform: translateY(-1px); border-left-color: var(--track-color, var(--accent)); }
  .card:hover .card-title { color: var(--track-color, var(--accent)); }

  .card-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card-top .eyebrow { color: var(--track-color, var(--accent)); }
  .card-idx { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; color: var(--muted); }

  .card-title {
    font-family: "Archivo", sans-serif;
    font-weight: 700; font-size: 17px; line-height: 1.25;
  }
  .card-sub { font-size: 12.5px; color: var(--muted); line-height: 1.5; flex: 1; }

  .card-meta {
    display: flex; gap: 12px; flex-wrap: wrap;
    font-family: "IBM Plex Mono", monospace; font-size: 10.5px; color: var(--muted);
    padding-top: 8px; border-top: 1px solid var(--border);
  }
  .card-meta b { color: var(--ink); font-weight: 600; }

  .empty-state { padding: 60px clamp(18px, 4vw, 44px); color: var(--muted); font-size: 14px; }

  /* ---------------- detail view ---------------- */

  .detail-bar {
    display: flex; align-items: center; gap: 14px;
    padding: 13px clamp(18px, 4vw, 44px);
    border-bottom: 1px solid var(--border);
  }
  .back-link {
    font: inherit; font-size: 13px; font-weight: 600;
    background: none; border: none; color: var(--muted); cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; padding: 0;
  }
  .back-link:hover { color: var(--ink); }
  .detail-meta { flex: 1; text-align: center; }
  .detail-meta .eyebrow { color: var(--track-color, var(--accent)); }
  .detail-meta .idx { color: var(--muted); font-family: "IBM Plex Mono", monospace; font-size: 11px; margin-left: 8px; }
  .pager { display: flex; gap: 6px; }
  .pager button {
    width: 30px; height: 30px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--ink); cursor: pointer; display: grid; place-items: center;
  }
  .pager button:hover:not(:disabled) { border-color: var(--track-color, var(--accent)); color: var(--track-color, var(--accent)); }
  .pager button:disabled { opacity: 0.35; cursor: default; }

  .detail-content { max-width: 700px; margin: 0 auto; padding: 40px clamp(18px, 4vw, 44px) 90px; }

  .doc-title { font-family: "Archivo", sans-serif; font-size: clamp(24px, 3vw, 32px); font-weight: 800; letter-spacing: -0.015em; margin-bottom: 8px; }
  .doc-subtitle { color: var(--muted); font-size: 15px; max-width: 66ch; line-height: 1.55; margin-bottom: 30px; }

  .block { margin-bottom: 28px; }
  .block:last-child { margin-bottom: 0; }

  .block-heading {
    display: flex; align-items: center; gap: 9px;
    font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--ink); margin: 0 0 12px;
  }
  .block-heading::before { content: ""; width: 3px; height: 13px; border-radius: 2px; background: var(--track-color, var(--accent)); flex-shrink: 0; }

  .prose p { margin: 0 0 12px; line-height: 1.65; font-size: 15px; max-width: 66ch; color: var(--ink); }
  .prose p:last-child { margin-bottom: 0; }
  .prose b { font-weight: 600; }

  .fact-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
  .fact-list li { position: relative; padding-left: 18px; font-size: 14.5px; line-height: 1.55; max-width: 64ch; }
  .fact-list li::before { content: ""; position: absolute; left: 0; top: 9px; width: 6px; height: 6px; border-radius: 50%; background: var(--track-color, var(--muted)); }

  .q-list { list-style: none; margin: 0; padding: 0; counter-reset: q; display: flex; flex-direction: column; gap: 12px; }
  .q-list li { counter-increment: q; display: grid; grid-template-columns: 24px 1fr; gap: 10px; font-size: 14.5px; line-height: 1.55; max-width: 64ch; }
  .q-list li::before {
    content: counter(q); font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 600;
    color: var(--track-color, var(--accent));
    background: color-mix(in srgb, var(--track-color, var(--accent)) 14%, var(--surface));
    width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center;
  }

  .signal-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
  .signal-list li { display: grid; grid-template-columns: 20px 1fr; gap: 10px; align-items: baseline; font-size: 14px; line-height: 1.55; max-width: 64ch; }
  .signal-list .mark { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 700; align-self: start; margin-top: 1px; }
  .signal-list.good .mark { background: var(--good-soft); color: var(--good); }
  .signal-list.bad .mark { background: var(--bad-soft); color: var(--bad); }

  .obj-scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; }
  .obj-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .obj-table th {
    text-align: left; font-family: "IBM Plex Mono", monospace; font-size: 10px; font-weight: 600;
    letter-spacing: 0.05em; text-transform: uppercase; color: var(--accent-ink);
    background: var(--track-color, var(--accent)); padding: 10px 14px;
  }
  .obj-table td { padding: 12px 14px; border-top: 1px solid var(--border); vertical-align: top; line-height: 1.5; }
  .obj-table tr:nth-child(even) td { background: var(--surface-sunken); }
  .obj-table td:first-child { font-weight: 600; white-space: nowrap; color: var(--ink); }
  .obj-table td:last-child { color: var(--muted); }

  .cross {
    background: var(--surface-sunken); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; font-size: 13.5px; line-height: 1.55; color: var(--muted); max-width: 66ch;
  }
  .cross b { color: var(--ink); }

  .doc-footer-nav {
    display: flex; justify-content: space-between; gap: 12px;
    margin-top: 44px; padding-top: 22px; border-top: 1px solid var(--border);
  }
  .foot-nav-btn {
    font: inherit; text-align: left; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 11px 14px; cursor: pointer; color: var(--ink);
    max-width: 46%; display: flex; flex-direction: column; gap: 3px;
  }
  .foot-nav-btn:hover { border-color: var(--track-color, var(--accent)); }
  .foot-nav-btn .dir { font-family: "IBM Plex Mono", monospace; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .foot-nav-btn.next { text-align: right; align-items: flex-end; margin-left: auto; }

  /* ---------------- misc ---------------- */

  .legend-strip {
    display: flex; gap: 18px; flex-wrap: wrap;
    padding: 12px clamp(18px, 4vw, 44px);
    font-size: 12px; color: var(--muted);
    background: var(--surface-sunken); border-bottom: 1px solid var(--border);
  }
  .legend-strip span { display: inline-flex; align-items: center; gap: 6px; }
  .legend-strip .dot { width: 7px; height: 7px; border-radius: 50%; }

  #printAll { padding: 20px 30px; }
  #printAll .print-doc { margin-bottom: 40px; padding-bottom: 30px; border-bottom: 1px solid var(--border); }
  #printAll .print-cover { text-align: center; padding: 60px 0 40px; }
  #printAll .print-cover h1 { font-family: "Archivo", sans-serif; font-size: 30px; font-weight: 800; }

  @media print {
    .topbar, .legend-strip, .track-filters, .index-hero, .detail-bar, .doc-footer-nav { display: none !important; }
    body.print-all-mode .index-view, body.print-all-mode .detail-view { display: none !important; }
    body:not(.print-all-mode) #printAll { display: none !important; }
    .block { break-inside: avoid; }
    #printAll .print-doc { break-before: page; }
    #printAll .print-cover { break-before: avoid; }
  }

  @media (max-width: 640px) {
    .topbar { flex-wrap: wrap; }
    .search-wrap { order: 3; max-width: 100%; }
    .detail-meta { display: none; }
  }
</style>

<header class="topbar">
  <button class="brand" id="brandHome">
    <div class="brand-mark">WC</div>
    <div class="brand-text">
      <div class="brand-name">Wired CIO</div>
      <div class="brand-sub">SDR PLAYBOOK</div>
    </div>
  </button>
  <div class="topbar-spacer"></div>
  <div class="search-wrap" id="searchWrap">
    <svg class="search-icon" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="5.2" stroke="currentColor" stroke-width="1.4"/><path d="M11 11L14.2 14.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
    <input class="search-input" id="navSearch" type="text" placeholder="Find a section…" autocomplete="off">
  </div>
  <button class="btn" id="printBtn">Print</button>
</header>

<div class="legend-strip">
  <span><span class="dot" style="background:var(--good)"></span>Buying signal — listen for this</span>
  <span><span class="dot" style="background:var(--bad)"></span>Red flag — disqualify</span>
</div>

<div class="index-view" id="indexView">
  <div class="index-hero">
    <span class="eyebrow" style="color:var(--accent)">Internal &middot; Outbound Sales</span>
    <h1>The Outbound Cheat Library</h1>
    <p class="tagline">&ldquo;When your technology works, so do your people.&rdquo; Twelve pages, one per topic — pick the one that matches the lead in front of you.</p>
  </div>
  <div class="track-filters" id="trackFilters"></div>
  <div class="card-grid" id="cardGrid"></div>
</div>

<div class="detail-view" id="detailView" hidden>
  <div class="detail-bar">
    <button class="back-link" id="backLink">&larr; All sections</button>
    <div class="detail-meta"><span class="eyebrow" id="detailKicker"></span><span class="idx" id="detailIdx"></span></div>
    <div class="pager">
      <button id="prevBtn" aria-label="Previous section">&larr;</button>
      <button id="nextBtn" aria-label="Next section">&rarr;</button>
    </div>
  </div>
  <div class="detail-content" id="detailContent"></div>
</div>

<div id="printAll" hidden></div>

<script>
  // ---------------------------------------------------------------------
  // Content

  const TRACKS = {

  };

  const TRACK_ORDER = ["foundations", "dynamics", "managedit", "customdev", "azure"];

  const SECTIONS = [

      overview: [

        "Founded by Russell, a technology leader with 15 years of IT experience and deep Microsoft expertise. The company exists because of a gap he saw firsthand: large enterprises run IT with reporting trees of eighty-plus specialists &mdash; help desk, system administrators, security engineers, and more &mdash; but growing companies need most of those same capabilities and can&rsquo;t field that full roster themselves. That&rsquo;s the gap Wired CIO fills.",

          "Always frame this as part of a custom app development conversation &mdash; the real question is “who&rsquo;s going to build the app that uses this,” not “do you want this Azure service.” Lead with custom app dev, mention Document Intelligence as the engine underneath.",
        ],
      },
      questions: {
        heading: "Discovery Questions &mdash; Ask On the Call",
        items: [
          "What documents are being processed manually today, and by how many people/how many hours a week?",
          "What system would the extracted data need to flow into &mdash; an ERP, a CRM, a database, a spreadsheet today?",
          "Roughly what volume are we talking about &mdash; documents per day or per month?",
          "Is there already an app or workflow in mind, or is this purely the manual-processing pain point so far?",
        ],
      },
      signalsGood: {
        heading: "Buying Signals &mdash; Listen For This Language",
        items: [
          "“Document Intelligence” mentioned by name.",
          "Any document-heavy manual process (invoice processing, forms, claims, contracts) combined with wanting a custom app or automation.",
        ],
      },
      crossSell: { text: "Business Central/ERP (invoice processing is the most common use case), custom app dev (the delivery vehicle), and Azure hosting/billing." },
    },
  ];

  // ---------------------------------------------------------------------
  // Derived indices
  // ---------------------------------------------------------------------
  const byKey = Object.fromEntries(SECTIONS.map((s, i) => [s.key, { ...s, order: i }]));
  const orderedKeys = SECTIONS.map((s) => s.key);

  function countMeta(s) {
    const parts = [];
    if (s.questions) parts.push(`${s.questions.items.length} Qs`);
    const sigCount = (s.signalsGood ? s.signalsGood.items.length : 0) + (s.signalsBad ? s.signalsBad.items.length : 0);
    if (sigCount) parts.push(`${sigCount} signals`);
    if (s.objections) parts.push(`${s.objections.rows.length} objections`);
    return parts;
  }

  function blockHTML(section) {
    let html = "";
    html += `<div class="block prose">${section.overview.map((p) => `<p>${p}</p>`).join("")}</div>`;

    if (section.wiredAngle) {
      html += `<div class="block"><h3 class="block-heading">${section.wiredAngle.heading}</h3><div class="prose">${section.wiredAngle.items.map((p) => `<p>${p}</p>`).join("")}</div></div>`;
    }
    if (section.facts) {
      html += `<div class="block"><h3 class="block-heading">${section.facts.heading}</h3><ul class="fact-list">${section.facts.items.map((f) => `<li>${f}</li>`).join("")}</ul></div>`;
    }
    if (section.icp) {
      html += `<div class="block"><h3 class="block-heading">${section.icp.heading}</h3><ul class="fact-list">${section.icp.items.map((f) => `<li>${f}</li>`).join("")}</ul></div>`;
    }
    if (section.questions) {
      html += `<div class="block"><h3 class="block-heading">${section.questions.heading}</h3><ol class="q-list">${section.questions.items.map((q) => `<li>${q}</li>`).join("")}</ol></div>`;
    }
    if (section.signalsGood) {
      html += `<div class="block"><h3 class="block-heading">${section.signalsGood.heading}</h3><ul class="signal-list good">${section.signalsGood.items.map((s) => `<li><span class="mark">+</span>${s}</li>`).join("")}</ul></div>`;
    }
    if (section.signalsBad) {
      html += `<div class="block"><h3 class="block-heading">${section.signalsBad.heading}</h3><ul class="signal-list bad">${section.signalsBad.items.map((s) => `<li><span class="mark">&times;</span>${s}</li>`).join("")}</ul></div>`;
    }
    if (section.objections) {
      html += `<div class="block"><h3 class="block-heading">${section.objections.heading}</h3><div class="obj-scroll"><table class="obj-table"><thead><tr><th>If they say&hellip;</th><th>Ask / respond with&hellip;</th></tr></thead><tbody>${section.objections.rows.map((r) => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("")}</tbody></table></div></div>`;
    }
    if (section.crossSell) {
      html += `<div class="block cross"><b>${section.crossSell.heading || "Cross-Sell / Related Offerings"}</b><br>${section.crossSell.text}</div>`;
    }
    return html;
  }

  // ---------------------------------------------------------------------
  // Index view: filters + cards
  // ---------------------------------------------------------------------
  const trackFilters = document.getElementById("trackFilters");
  const cardGrid = document.getElementById("cardGrid");
  let activeTrack = "all";
  let activeQuery = "";

  function renderChips() {
    trackFilters.innerHTML = "";
    const allChip = document.createElement("button");
    allChip.className = "chip" + (activeTrack === "all" ? " active" : "");
    allChip.innerHTML = `<span class="swatch"></span>All sections`;
    allChip.addEventListener("click", () => { activeTrack = "all"; renderChips(); renderCards(); });
    trackFilters.appendChild(allChip);

    TRACK_ORDER.forEach((key) => {
      const t = TRACKS[key];
      const chip = document.createElement("button");
      chip.className = "chip" + (activeTrack === key ? " active" : "");
      chip.style.setProperty("--chip-color", t.color);
      chip.innerHTML = `<span class="swatch"></span>${t.label}`;
      chip.addEventListener("click", () => { activeTrack = key; renderChips(); renderCards(); });
      trackFilters.appendChild(chip);
    });
  }

  function renderCards() {
    const q = activeQuery.trim().toLowerCase();
    const filtered = SECTIONS.filter((s) => {
      if (activeTrack !== "all" && s.track !== activeTrack) return false;
      if (q && !(s.title.toLowerCase().includes(q) || s.subtitle.toLowerCase().includes(q) || s.kicker.toLowerCase().includes(q))) return false;
      return true;
    });

    cardGrid.innerHTML = "";
    if (!filtered.length) {
      cardGrid.innerHTML = `<div class="empty-state">No sections match &ldquo;${activeQuery}&rdquo;.</div>`;
      return;
    }
    filtered.forEach((s) => {
      const idx = orderedKeys.indexOf(s.key) + 1;
      const t = TRACKS[s.track];
      const card = document.createElement("button");
      card.className = "card";
      card.style.setProperty("--track-color", t.color);
      const meta = countMeta(s);
      card.innerHTML =
        `<div class="card-top"><span class="eyebrow">${s.kicker}</span><span class="card-idx mono">${String(idx).padStart(2, "0")}</span></div>` +
        `<div class="card-title">${s.title}</div>` +
        `<div class="card-sub">${s.subtitle}</div>` +
        `<div class="card-meta">${meta.map((m) => `<span><b>${m.split(" ")[0]}</b> ${m.split(" ").slice(1).join(" ")}</span>`).join("")}</div>`;
      card.addEventListener("click", () => { location.hash = s.key; });
      cardGrid.appendChild(card);
    });
  }

  document.getElementById("navSearch").addEventListener("input", (e) => {
    activeQuery = e.target.value;
    renderCards();
  });

  renderChips();
  renderCards();

  // ---------------------------------------------------------------------
  // Detail view + routing
  // ---------------------------------------------------------------------
  const indexView = document.getElementById("indexView");
  const detailView = document.getElementById("detailView");
  const detailContent = document.getElementById("detailContent");
  const detailKicker = document.getElementById("detailKicker");
  const detailIdx = document.getElementById("detailIdx");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");

  function neighborButton(key, dir) {
    if (!key) return `<span></span>`;
    const s = byKey[key];
    return `<button class="foot-nav-btn ${dir}" data-goto="${key}"><span class="dir">${dir === "next" ? "Next" : "Previous"}</span><span>${s.title}</span></button>`;
  }

  function showDetail(key) {
    const section = byKey[key];
    if (!section) { showIndex(); return; }
    const idx = section.order;
    const t = TRACKS[section.track];

    indexView.hidden = true;
    detailView.hidden = false;
    detailView.style.setProperty("--track-color", t.color);
    detailKicker.textContent = section.kicker;
    detailKicker.style.color = t.color;
    detailIdx.textContent = `${String(idx + 1).padStart(2, "0")} / ${SECTIONS.length}`;

    const prevKey = orderedKeys[idx - 1] || null;
    const nextKey = orderedKeys[idx + 1] || null;
    prevBtn.disabled = !prevKey;
    nextBtn.disabled = !nextKey;
    prevBtn.onclick = () => prevKey && (location.hash = prevKey);
    nextBtn.onclick = () => nextKey && (location.hash = nextKey);

    detailContent.style.setProperty("--track-color", t.color);
    detailContent.innerHTML =
      `<div class="doc-title">${section.title}</div>` +
      `<div class="doc-subtitle">${section.subtitle}</div>` +
      blockHTML(section) +
      `<div class="doc-footer-nav">${neighborButton(prevKey, "prev")}${neighborButton(nextKey, "next")}</div>`;

    detailContent.querySelectorAll("[data-goto]").forEach((btn) => {
      btn.addEventListener("click", () => { location.hash = btn.dataset.goto; });
    });

    window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  }

  function showIndex() {
    detailView.hidden = true;
    indexView.hidden = false;
  }

  function routeFromHash() {
    const key = location.hash.replace(/^#/, "");
    if (key && byKey[key]) showDetail(key);
    else showIndex();
  }

  window.addEventListener("hashchange", routeFromHash);
  document.getElementById("backLink").addEventListener("click", () => { location.hash = ""; });
  document.getElementById("brandHome").addEventListener("click", () => { location.hash = ""; });
  routeFromHash();

  // ---------------------------------------------------------------------
  // Print
  // ---------------------------------------------------------------------
  const printAllEl = document.getElementById("printAll");

  function buildPrintAll() {
    let html = `<div class="print-cover"><h1>Wired CIO SDR Playbook</h1><p>Outbound Cheat Library — internal reference, generated for print.</p></div>`;
    SECTIONS.forEach((s) => {
      const t = TRACKS[s.track];
      html += `<div class="print-doc" style="--track-color:${t.color}"><span class="eyebrow" style="color:${t.color}">${s.kicker}</span><div class="doc-title">${s.title}</div><div class="doc-subtitle">${s.subtitle}</div>${blockHTML(s)}</div>`;
    });
    printAllEl.innerHTML = html;
  }
  buildPrintAll();

  document.getElementById("printBtn").addEventListener("click", () => {
    if (detailView.hidden) {
      document.body.classList.add("print-all-mode");
      printAllEl.hidden = false;
    }
    window.print();
  });
  window.addEventListener("afterprint", () => {
    document.body.classList.remove("print-all-mode");
    printAllEl.hidden = true;
  });
</script>
